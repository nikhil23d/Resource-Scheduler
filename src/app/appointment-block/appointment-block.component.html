<div 
  class="appointment-block"
  [class.appointment]="appointment.type === 'appointment'"
  [class.unavailable]="appointment.type === 'unavailable'"
  [style.top.px]="top"
  [style.height.px]="height"
  [style.background-color]="getAppointmentColor(appointment)"
>
  <div class="appointment-title">{{ appointment.title }}</div>
  <div class="appointment-time">
    {{ getTimeString(appointment.start) }} - {{ getTimeString(appointment.end) }}
  </div>
</div>
