<div class="resource-column">
  <ng-container *ngFor="let appointment of getAppointmentsForResource(); trackBy: trackByAppointment">
    <app-appointment-block 
      [appointment]="appointment"
      [top]="calculatePosition(appointment.start)"
      [height]="calculateHeight(appointment.start, appointment.end)"
    ></app-appointment-block>
  </ng-container>
</div>
